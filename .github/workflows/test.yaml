on: [push]

jobs:
  testjob:
    runs-on: ubuntu-latest
    name: Test Package RPM
    steps:
      - name: Checkout action repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Test action
        id: build
        uses: ./
        with:
          spec_file: test/rpmbuild/SPECS/test.spec
